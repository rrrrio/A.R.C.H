name: arch

services:
  ollama:
    image: ollama/ollama:0.40.15
    profiles: ["models"]
    environment:
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      ALL_PROXY: ${ALL_PROXY:-${HTTP_PROXY:-}}
      http_proxy: ${HTTP_PROXY:-}
      https_proxy: ${HTTPS_PROXY:-}
      all_proxy: ${ALL_PROXY:-${HTTP_PROXY:-}}
      NO_PROXY: 127.0.0.1,localhost,host.docker.internal
      no_proxy: 127.0.0.1,localhost,host.docker.internal
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ../data/models/ollama:/root/.ollama
      - ../data/models:/models:ro
      - ./ollama:/modelfiles:ro
    gpus: all
    mem_limit: ${ARCH_OLLAMA_MEMORY_MAX:-12g}
    cpus: ${ARCH_OLLAMA_CPU_LIMIT:-8.0}
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"
    healthcheck:
      test: ["CMD", "/bin/ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  caddy:
    image: caddy:2.11.8-alpine
    profiles: ["gateway"]
    network_mode: host
    environment:
      ARCH_LAN_HOST: ${ARCH_LAN_HOST:-${LVA_LAN_HOST:-arch.local}}
      ARCH_HTTPS_PORT: ${ARCH_HTTPS_PORT:-${LVA_HTTPS_PORT:-8443}}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../frontend/dist:/srv:ro
      - ./caddy-data:/data
      - ./caddy-config:/config
    mem_limit: ${ARCH_CADDY_MEMORY_MAX:-512m}
    cpus: ${ARCH_CADDY_CPU_LIMIT:-1.0}
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:2019/healthz"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  searxng:
    image: searxng/searxng@sha256:c750ee1d859b26d3aeae51c07f6a48c3a0bfbaa9195d71a18b258862d88c4c3c
    profiles: ["search"]
    entrypoint: ["/bin/sh", "/etc/searxng/lva-entrypoint.sh"]
    env_file:
      - path: ../data/runtime/searxng.env
        required: false
    environment:
      SEARXNG_BASE_URL: http://127.0.0.1:8080/
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      ALL_PROXY: ${ALL_PROXY:-${HTTP_PROXY:-}}
      http_proxy: ${HTTP_PROXY:-}
      https_proxy: ${HTTPS_PROXY:-}
      all_proxy: ${ALL_PROXY:-${HTTP_PROXY:-}}
      NO_PROXY: 127.0.0.1,localhost
      no_proxy: 127.0.0.1,localhost
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./searxng:/etc/searxng:rw
    mem_limit: ${ARCH_SEARXNG_MEMORY_MAX:-1g}
    cpus: ${ARCH_SEARXNG_CPU_LIMIT:-2.0}
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
