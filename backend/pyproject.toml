[project]
name = "local-voice-agent"
version = "0.1.0"
description = "Local-first real-time voice agent"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.162.2",
    "pipecat-ai==1.15.0",
    "pydantic-settings>=2.6,<3",
    "uvicorn[standard]>=0.30,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "mypy==2.4.1",
    "pytest==8.3.5",
    "pytest-asyncio>=0.25,<1",
    "ruff==0.16.8",
]
benchmark = [
    "av==18.1.0",
    "faster-whisper>=1.2,<2",
    "silero-vad>=6,<7",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/local_voice_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-q"]
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
