[project]
name = "arch"
version = "0.1.0"
description = "Local-first real-time voice agent for A.R.C.H."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "argon2-cffi==25.1.0",
    "fastapi==0.162.2",
    "httpx>=0.28,<1",
    "pipecat-ai[kokoro,webrtc,whisper]==1.15.0",
    "pydantic-settings>=2.6,<3",
    "pypdf==6.1.0",
    "sentence-transformers==5.2.2",
    "uvicorn[standard]>=0.30,<1",
]

[dependency-groups]
dev = [
    "mypy==2.4.1",
    "pytest==8.3.5",
    "pytest-asyncio>=0.25,<1",
    "ruff==0.16.8",
]
benchmark = [
    "av==18.1.0",
    "faster-whisper>=1.2,<2",
    "kokoro-onnx==0.6.1",
    "misaki-fork[zh]==0.9.6",
    "silero-vad>=6,<7",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-q"]
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
files = ["src", "tests", "scripts"]
