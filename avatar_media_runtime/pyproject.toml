[project]
name = "avatar-media-runtime"
version = "0.1.0"
description = "Loopback-only A.R.C.H. avatar audio/video media runtime"
requires-python = ">=3.10,<3.13"
dependencies = [
    "aiortc>=1.14,<2",
    "fastapi>=0.162,<1",
    "opencv-python-headless>=4.10,<5",
    "uvicorn[standard]>=0.30,<1",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.25,<1",
    "ruff>=0.16,<1",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/avatar_media_runtime"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-q"]
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
