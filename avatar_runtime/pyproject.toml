[project]
name = "arch-avatar-runtime"
version = "0.1.0"
description = "Isolated A.R.C.H. video-avatar worker"
requires-python = ">=3.12,<3.13"
dependencies = [
    "av>=18,<19",
    "numpy>=1.26,<3",
    "pillow>=10,<13",
]

[project.scripts]
arch-avatar-worker = "avatar_runtime.worker:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/avatar_runtime"]
